
apiVersion: v1
kind: ConfigMap
metadata:
  name: scaletestapp-adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
    - seriesQuery: 'http_requests_total'
      resources:
        # Мапим "http_requests_total" в "http_requests_per_second"  
        overrides:
          namespace: {resource: namespace}
          pod: {resource: pod}
      name:
        as: http_requests_per_second
      metricsQuery: 'sum(rate(http_requests_total[1m])) by (<<.GroupBy>>)'