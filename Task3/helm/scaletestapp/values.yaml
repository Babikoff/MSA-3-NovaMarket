replicaCount: 1

image:
  name: ghcr.io/yandex-practicum/scaletestapp
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "20Mi"
    cpu: "50m"
  limits:
    memory: "30Mi"
    cpu: "50m"

# Not related to current task but is a standard
livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
